name: Build and release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  ICED_TEST_BACKEND: tiny-skia
  MACOSX_DEPLOYMENT_TARGET: '11.0'
  # CI does not need debugger symbols; retain normal optimization/assertion levels.
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            rustflags: -C linker=clang -C link-arg=-fuse-ld=mold
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            rustflags: ''
          - os: macos-15-intel
            target: x86_64-apple-darwin
            rustflags: ''
          - os: macos-15
            target: aarch64-apple-darwin
            rustflags: ''
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libxkbcommon-dev libwayland-dev libudev-dev fonts-dejavu-core clang mold
      - name: Set up Rust
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup target add "$BUILD_TARGET"
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          package_id=$(cargo pkgid --locked -p nia)
          version=${package_id##*#}
          version=${version##*@}
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Production releases require a stable X.Y.Z version' >&2; exit 1; }
          [[ -z $RELEASE_TAG || $RELEASE_TAG == "v$version" ]] || { echo "Tag $RELEASE_TAG must match v$version" >&2; exit 1; }
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          release_name="v$version"
          if [[ $GITHUB_REF == refs/heads/master ]]; then
            release_name+="-preview.${GITHUB_SHA::7}"
          fi
          echo "RELEASE_NAME=$release_name" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Check formatting
        run: cargo fmt --check
      - name: Check compilation
        run: cargo check --locked
      - name: Lint all features
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Run tests, including headless Iced interactions
        run: cargo test --locked
      - name: Build production binary
        if: github.event_name != 'pull_request'
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: cargo build --locked --release --target "$BUILD_TARGET"
      - name: Package native binary and checksum
        if: github.event_name != 'pull_request'
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          name="nia-$RELEASE_NAME-$BUILD_TARGET"
          executable=nia
          [[ $RUNNER_OS == Windows ]] && executable=nia.exe
          binary="target/$BUILD_TARGET/release/$executable"
          test -f "$binary"
          mkdir -p dist
          stage="dist/$name"
          mkdir "$stage"
          cp README.md HANDBOOK.md LICENSE PRIVACY.md "$stage/"
          if [[ $RUNNER_OS == macOS ]]; then
            mkdir -p "$stage/nia.app/Contents/MacOS"
            cp "$binary" "$stage/nia.app/Contents/MacOS/nia"
            cat > "$stage/nia.app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>nia</string>
            <key>CFBundleIdentifier</key><string>io.github.johncmanuel.nia</string>
            <key>CFBundleName</key><string>nia</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$RELEASE_VERSION</string>
            <key>CFBundleVersion</key><string>$RELEASE_VERSION</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF
            DITTONORSRC=1 ditto -c -k --keepParent "$stage" "dist/$name.zip"
            (cd dist && shasum -a 256 "$name.zip" > "$name.zip.sha256")
          elif [[ $RUNNER_OS == Windows ]]; then
            cp "$binary" "$stage/nia.exe"
            export PACKAGE_NAME="$name"
            pwsh -NoProfile -Command '
              $ErrorActionPreference = "Stop"
              $archive = "dist/$($env:PACKAGE_NAME).zip"
              Compress-Archive -Path "dist/$($env:PACKAGE_NAME)" -DestinationPath $archive -Force
              $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
              [System.IO.File]::WriteAllText("$archive.sha256", "$hash  $($env:PACKAGE_NAME).zip`n", [System.Text.UTF8Encoding]::new($false))
            '
          else
            cp "$binary" "$stage/nia"
            tar -czf "dist/$name.tar.gz" -C dist "$name"
            (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          fi
          rm -r "$stage"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: ${{ github.ref == 'refs/heads/master' && 'preview' || 'production' }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify all release archives
        working-directory: dist
        run: |
          test "$(find . -name '*.sha256' | wc -l)" -eq 4
          sha256sum --check ./*.sha256
      - name: Publish verified archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          release_tag="$GITHUB_REF_NAME"
          options=(--verify-tag --title "nia $release_tag")
          if [[ $GITHUB_REF == refs/heads/master ]]; then
            release_tag="preview-$GITHUB_SHA"
            options=(--target "$GITHUB_SHA" --prerelease --latest=false --title "nia preview ${GITHUB_SHA::7}")
          fi
          gh release create "$release_tag" dist/* --draft --generate-notes "${options[@]}"
          gh release edit "$release_tag" --draft=false
