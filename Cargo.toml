[package]
name = "nia"
version = "0.1.0"
edition = "2024"

[features]
default = ["debug-tools"]
debug-tools = ["iced/debug"]

[dependencies]
iced = { version = "0.14.0", default-features = false, features = ["smol", "advanced", "wgpu", "tiny-skia", "image", "markdown", "x11", "wayland"] }
rfd = "0.17.2"
log = "0.4"
fontdb = "0.23.0"

[dev-dependencies]
iced = { version = "0.14.0", default-features = false, features = ["canvas"] }
iced_test = "0.14.0"
png = "0.18.1"
